<body>
  <header data-topbar="../../"></header>

  <main class="wrap">
    <div class="page-head">
      <h1>LSB 隐写 · 图形通道</h1>
      <p>
        水印不转成比特串，而是先画成一整张透明底的文字图，用它的 alpha 通道当比特源写进目标分量的最低位。
        解码时把这一位放大成黑白图，水印直接「显影」——不需要知道任何长度或编码格式。
      </p>
    </div>

    <div class="note">
      <strong>必须导出 PNG。</strong>JPEG 有损压缩会重写最低有效位，水印会整片糊掉。
    </div>

    <div class="card">
      <h2 style="margin-top:0">嵌入</h2>
      <div class="cols">
        <div class="field">
          <label for="waterMark">水印文字</label>
          <input type="text" id="waterMark" value="内部资料" placeholder="会斜向平铺满整张图">
        </div>
        <div class="field">
          <label for="channel">写入通道</label>
          <select id="channel">
            <option value="G">G · 绿色（人眼最敏感，改动最难察觉）</option>
            <option value="R">R · 红色</option>
            <option value="B">B · 蓝色</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-top:14px">
        <label for="encodeInput">选择原图（建议 PNG）</label>
        <input type="file" id="encodeInput" accept="image/*">
      </div>
      <div class="btn-row" style="margin:14px 0">
        <button class="btn btn--primary" id="download" disabled>下载带水印的 PNG</button>
      </div>
      <div class="cols">
        <div class="figure">
          <p class="muted">水印图层（白字透明底，这里衬了深色只为看得见）</p>
          <div class="canvas-box" style="background:#17171a"><canvas id="encodeTextCanvas"></canvas></div>
        </div>
        <div class="figure">
          <p class="muted">合成结果</p>
          <div class="canvas-box"><canvas id="encodeCanvas"></canvas></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">提取</h2>
      <div class="field">
        <label for="decodeInput">选择带水印的图片（通道要和嵌入时一致）</label>
        <input type="file" id="decodeInput" accept="image/*">
      </div>
      <div class="cols" style="margin-top:14px">
        <div class="figure">
          <p class="muted">原图</p>
          <div class="canvas-box"><canvas id="decodeImageCanvas"></canvas></div>
        </div>
        <div class="figure">
          <p class="muted">最低位平面</p>
          <div class="canvas-box"><canvas id="decodeCanvas"></canvas></div>
        </div>
      </div>
    </div>

    <footer class="site">图片不会上传 · <a href="../../">返回首页</a></footer>
  </main>
