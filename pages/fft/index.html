<body>
  <header data-topbar="../../"></header>

  <main class="wrap">
    <div class="page-head">
      <h1>频域盲水印（FFT）</h1>
      <p>
        对图像做离散傅里叶变换，把水印文字对称地写进频谱，再逆变换回空域。
        水印被摊到了全图的频率成分里，裁剪、缩放、压缩、甚至截屏都很难把它抹干净——
        这是这一页和 LSB 最本质的区别。
      </p>
    </div>

    <div class="note">
      本页依赖 <code>opencv.js</code>（约 11 MB），首次使用时才按需下载，请耐心等一下。
    </div>

    <div class="card">
      <h2 style="margin-top:0">嵌入</h2>
      <div class="cols">
        <div class="field">
          <label for="waterMark">水印文字（建议英文或数字，中文字形依赖系统字体）</label>
          <input type="text" id="waterMark" value="unStone" placeholder="输入水印">
        </div>
        <div class="field">
          <label for="fontSize">字号系数 <span id="fontSize-v" class="cp">1.1</span></label>
          <input type="range" id="fontSize" min="0.5" max="3" step="0.1" value="1.1">
        </div>
      </div>
      <div class="field" style="margin-top:14px">
        <label for="encodeInput">选择原图</label>
        <input type="file" id="encodeInput" accept="image/*">
      </div>
      <p class="muted" id="encodeProcess" style="margin:12px 0 0"></p>
      <div class="cols" style="margin-top:14px">
        <div class="figure">
          <p class="muted">处理前</p>
          <div class="canvas-box" id="encodeInputImg"></div>
        </div>
        <div class="figure">
          <p class="muted">处理后</p>
          <div class="canvas-box" id="encodeImg"></div>
        </div>
      </div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn btn--primary" id="downloadEncode" disabled>下载带水印的 PNG</button>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">提取</h2>
      <p class="muted" style="margin-top:0">解析的是频谱图，水印会以镜像对称的形式出现在图的上下两侧。</p>
      <div class="field">
        <label for="decodeInput">选择带水印的图片</label>
        <input type="file" id="decodeInput" accept="image/*">
      </div>
      <p class="muted" id="decodeProcess" style="margin:12px 0 0"></p>
      <div class="cols" style="margin-top:14px">
        <div class="figure">
          <p class="muted">解析前</p>
          <div class="canvas-box" id="decodeInputImg"></div>
        </div>
        <div class="figure">
          <p class="muted">频谱（水印在这里）</p>
          <div class="canvas-box" id="decodeImg"></div>
        </div>
      </div>
    </div>

    <footer class="site">图片不会上传，opencv.js 由 CDN 提供 · <a href="../../">返回首页</a></footer>
  </main>

  <script src="../../assets/ui.js"></script>
