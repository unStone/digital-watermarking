<body>

    <script>document.addEventListener('DOMContentLoaded', function () { UI.mountTopbar(''); });</script>
    <h1>LSB 隐写 · 口令加密</h1>
    <div id='about' class='section'>
        写入前先用 SJCL 做 AES 加密，没有口令，就算知道算法也读不出内容。<br/>
        选图后会自动尝试解码；导出请务必用 PNG，JPEG 压缩会直接抹掉最低有效位。<br/>
        本页直接沿用了
        <a href='https://github.com/oakes/PixelJihad' target='_blank' rel='noopener'>PixelJihad</a>
        （作者 Zach Oakes）的实现，仅作对照演示。
    </div>
    <div id='main' class='section dark'>
        <div class='step'>选择一张图片</div>
        <img id='preview' class='preview hide' />
        <div class='sectionbody'>
            <input type='file' id='file' />
        </div>
    </div>
    <div id='choose' class='section dark hide'>
        <div class='step'>想做什么？</div>
        <div class='sectionbody'>
            <div class='left'>
                <textarea id='message' class='message' maxlength='1000'
                    placeholder='输入要隐藏的内容'></textarea>
                <input type='password' id='password' class='password'
                    placeholder='口令（可选）' />
                <button id='encode' class='submit'>写入</button>
            </div>
            <div class='right'>
                <input type='password' id='password2' class='password'
                    placeholder='口令' />
                <button id='decode' class='submit'>读取</button>
            </div>
        </div>
    </div>
    <div id='reveal' class='section dark hide'>
        <div class='step'>隐藏的内容</div>
        <div id='messageDecoded' class='sectionbody'></div>
    </div>
    <canvas id='canvas' class='hide'></canvas>
    <div class='section'><img id='output' /></div>
    <footer class="site" style="max-width:640px;margin:0 auto;text-align:left">
        图片不会上传 · <a href="../../">返回首页</a> ·
