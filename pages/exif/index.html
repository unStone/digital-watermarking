<body>

  <main class="wrap">
    <div class="page-head">
      <h1>EXIF 元信息</h1>
      <p>
        严格说 EXIF 不算水印，但它是最容易被忽略的「作者标记」：
        相机型号、拍摄时间、软件版本，甚至精确到十几米的 GPS 坐标，全都明文躺在文件头里。
        随手发一张原图，等于把这些一起发出去了。
      </p>
    </div>

    <div class="card">
      <div class="field">
        <label for="file">选择一张图片（手机直出的原图信息最全）</label>
        <input type="file" id="file" accept="image/*">
      </div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn btn--primary" id="strip" disabled>导出无元信息副本</button>
        <span class="muted">重新编码一遍即可抹掉全部 EXIF</span>
      </div>
    </div>

    <div id="gps-card" class="card" hidden>
      <h2 style="margin-top:0"><span class="badge badge--danger">隐私</span> GPS 位置</h2>
      <p style="margin:0">
        经度 <strong id="lon">—</strong> ，纬度 <strong id="lat">—</strong>
      </p>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn" id="copy-gps">复制坐标</button>
        <a class="btn" id="map-link" target="_blank" rel="noopener">在地图上打开</a>
      </div>
    </div>

    <div id="tags-card" class="card" hidden>
      <h2 style="margin-top:0">全部元信息 <span class="muted" id="tag-count"></span></h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>字段</th><th>值</th></tr></thead>
          <tbody id="tags"></tbody>
        </table>
      </div>
    </div>

    <p id="empty" class="muted" hidden>这张图片里没有读到 EXIF —— 多数社交平台在上传时就已经把它清掉了。</p>

    <footer class="site">图片不会上传 · <a href="../../">返回首页</a></footer>
